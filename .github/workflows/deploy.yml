name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would change, upload nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run || false }}
          # Anything matched here is neither uploaded nor deleted on the server.
          # php/mail-config.php holds the live Gmail App Password, is gitignored,
          # and lives only on the server — it must survive every sync.
          exclude: |
            **/.git*
            **/.git*/**
            **/.superpowers/**
            docs/**
            *.md
            *.zip
            **/*.log
            php/mail-config.php
            .user.ini
            php.ini
            smtp-probe.php
